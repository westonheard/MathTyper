[package]
name = "mathtyper"
version = "0.1.0"
description = "Visual editor that writes LaTeX"
authors = ["Weston Heard"]
edition = "2021"

[lib]
# the _lib suffix keeps the lib name from clashing with the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "mathtyper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
