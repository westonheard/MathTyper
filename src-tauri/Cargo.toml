[package]
name = "mathtyper"
version = "0.1.1"
description = "Visual editor that writes LaTeX"
authors = ["Weston Heard"]
edition = "2021"

[lib]
# the _lib suffix keeps the lib name from clashing with the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "mathtyper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# smaller binary, the app spends its time in the webview and not in this code
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
